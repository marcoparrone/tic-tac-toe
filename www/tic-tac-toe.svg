<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
  width="100%" height="100%" onload="do_onstartup()">
<script type="text/javascript" xlink:href="tic-tac-toe.js" />

<!-- boards lines -->
<line x1="100" y1="100" x2="100" y2="400" stroke-width="2" stroke="black" />
<line x1="200" y1="100" x2="200" y2="400" stroke-width="2" stroke="black" />
<line x1="0"   y1="200" x2="300" y2="200" stroke-width="2" stroke="black" />
<line x1="0"   y1="300" x2="300" y2="300" stroke-width="2" stroke="black" />

<!-- circles -->
<circle id="c0" cx="50"  cy="150" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />
<circle id="c1" cx="150" cy="150" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />
<circle id="c2" cx="250" cy="150" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />

<circle id="c3" cx="50"  cy="250" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />
<circle id="c4" cx="150" cy="250" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />
<circle id="c5" cx="250" cy="250" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />

<circle id="c6" cx="50"  cy="350" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />
<circle id="c7" cx="150" cy="350" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />
<circle id="c8" cx="250" cy="350" r="40" fill="none" stroke="black" stroke-width="3" opacity="0" />

<!-- Xs -->
<path id="x0" d="M  15 115 L  85 185 Z M  15 185 L  85 115" stroke="black" fill="none" stroke-width="3" opacity="0" />
<path id="x1" d="M 115 115 L 185 185 Z M 115 185 L 185 115" stroke="black" fill="none" stroke-width="3" opacity="0" />
<path id="x2" d="M 215 115 L 285 185 Z M 215 185 L 285 115" stroke="black" fill="none" stroke-width="3" opacity="0" />

<path id="x3" d="M   5 215 L  85 285 Z M   5 285 L  85 215" stroke="black" fill="none" stroke-width="3" opacity="0" />
<path id="x4" d="M 115 215 L 185 285 Z M 115 285 L 185 215" stroke="black" fill="none" stroke-width="3" opacity="0" />
<path id="x5" d="M 215 215 L 285 285 Z M 215 285 L 285 215" stroke="black" fill="none" stroke-width="3" opacity="0" />

<path id="x6" d="M   5 315 L  85 385 Z M   5 385 L  85 315" stroke="black" fill="none" stroke-width="3" opacity="0" />
<path id="x7" d="M 115 315 L 185 385 Z M 115 385 L 185 315" stroke="black" fill="none" stroke-width="3" opacity="0" />
<path id="x8" d="M 215 315 L 285 385 Z M 215 385 L 285 315" stroke="black" fill="none" stroke-width="3" opacity="0" />

<!-- rectangles -->
<rect id="r0" onclick="onclick_r(&quot;r0&quot;)" x="5"   y="105" height="90" width="90" opacity="0" />
<rect id="r1" onclick="onclick_r(&quot;r1&quot;)" x="105" y="105" height="90" width="90" opacity="0" />
<rect id="r2" onclick="onclick_r(&quot;r2&quot;)" x="205" y="105" height="90" width="90" opacity="0" />

<rect id="r3" onclick="onclick_r(&quot;r3&quot;)" x="5"   y="205" height="90" width="90" opacity="0" />
<rect id="r4" onclick="onclick_r(&quot;r4&quot;)" x="105" y="205" height="90" width="90" opacity="0" />
<rect id="r5" onclick="onclick_r(&quot;r5&quot;)" x="205" y="205" height="90" width="90" opacity="0" />

<rect id="r6" onclick="onclick_r(&quot;r6&quot;)" x="5"   y="305" height="90" width="90" opacity="0" />
<rect id="r7" onclick="onclick_r(&quot;r7&quot;)" x="105" y="305" height="90" width="90" opacity="0" />
<rect id="r8" onclick="onclick_r(&quot;r8&quot;)" x="205" y="305" height="90" width="90" opacity="0" />

</svg>
