<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tic Tac Toe</title>
    <link rel="shortcut icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="Description" content="A tic tac toe game.">
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="t-152.png">
    <meta name="apple-mobile-web-app-capable" content="yes">  
    <meta name="apple-mobile-web-app-status-bar-style" content="white"> 
    <meta name="apple-mobile-web-app-title" content="Tic Tac Toe"> 
    <meta name="msapplication-TileImage" content="t-144.png">  
    <meta name="msapplication-TileColor" content="#000000">
    <style>
      html, body {
	  width:  100%;
	  height: 100%;
	  margin: 0;
	  border: 0;
	  overflow: hidden; /*  Disable scrollbars */
	  display: block;  /* No floating content on sides */
      }
      canvas.webapp {
	  background-color: black;
	  position: absolute;
	  top: 0px;
	  left: 0px;
	  margin: 0px;
	  border: 0;
	  width: 100%;
	  height: 100%;
	  overflow: hidden;
	  display: block;
      }
    </style>
    <script>"serviceWorker"in navigator&&window.addEventListener("load",()=>{navigator.serviceWorker.register("service-worker.js")});</script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to view this website.</noscript>
    <canvas className="webapp" id="canvas" tabIndex="-1">ERROR: Cannot create canvas.</canvas>
    <script type="text/javascript" src="@JSFILE@" async></script>
  </body>
</html>
